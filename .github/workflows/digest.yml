name: daily-storage-digest

on:
  schedule:
    - cron: '11 0,1,2,3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laoma-state
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q yfinance requests
      - run: python watch.py --digest
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
          HOLDINGS_JSON: ${{ secrets.HOLDINGS_JSON }}
      - name: save state
        run: |
          git config user.name "watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "update state [skip ci]" && git push)
